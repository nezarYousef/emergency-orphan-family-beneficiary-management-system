name: Production database migration
on:
  workflow_dispatch:
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: pgsql
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, intl
          coverage: none
      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Inspect production schema safely
        run: php artisan tinker --execute="dump(collect(DB::select(\"select table_name from information_schema.tables where table_schema='public' order by table_name\"))->pluck('table_name')->all());"
      - run: php artisan migrate --force
      - run: php artisan db:seed --force
